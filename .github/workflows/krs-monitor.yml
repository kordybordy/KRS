name: KRS Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These entries approximate Thursday 09:00 Europe/Warsaw
    # without weekly skipped runs. DST transition weeks may run one hour off.
    - cron: "0 8 * 1,2,3,11,12 4"
    - cron: "0 7 * 4,5,6,7,8,9,10 4"

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run KRS monitor
        id: report
        run: python -m krs_monitor.main

      - name: Send weekly report email
        env:
          KRS_EMAIL_SMTP_HOST: ${{ secrets.KRS_EMAIL_SMTP_HOST }}
          KRS_EMAIL_SMTP_PORT: ${{ secrets.KRS_EMAIL_SMTP_PORT }}
          KRS_EMAIL_USERNAME: ${{ secrets.KRS_EMAIL_USERNAME }}
          KRS_EMAIL_PASSWORD: ${{ secrets.KRS_EMAIL_PASSWORD || secrets.AGENTMAIL }}
          KRS_EMAIL_FROM: ${{ secrets.KRS_EMAIL_FROM }}
          KRS_EMAIL_TO: ${{ secrets.KRS_EMAIL_TO }}
          KRS_EMAIL_USE_TLS: ${{ secrets.KRS_EMAIL_USE_TLS }}
          KRS_EMAIL_USE_SSL: ${{ secrets.KRS_EMAIL_USE_SSL }}
          KRS_EMAIL_SUBJECT_PREFIX: ${{ secrets.KRS_EMAIL_SUBJECT_PREFIX }}
          KRS_EMAIL_MAX_DETAILS: ${{ secrets.KRS_EMAIL_MAX_DETAILS }}
          REPORT_DATE: ${{ steps.report.outputs.report_date }}
        run: |
          test -n "$REPORT_DATE"
          python -m krs_monitor.notifications --report-date "$REPORT_DATE"

      - name: Add report summary to job summary
        if: always()
        run: |
          latest_summary="$(find reports -mindepth 2 -maxdepth 2 -name summary.txt | sort | tail -n 1)"
          if [ -n "$latest_summary" ]; then
            {
              echo "## KRS monitor result"
              echo
              cat "$latest_summary"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## KRS monitor result" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary report found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krs-report
          path: reports/

      - name: Commit monitoring outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/archive reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            report_date="$(TZ=Europe/Warsaw date +%F)"
            git commit -m "krs-monitor: weekly report ${report_date}"
            git push
          fi

      - name: Prepare GitHub issue notification
        id: github_notification
        env:
          KRS_GITHUB_NOTIFY_USERS: ${{ vars.KRS_GITHUB_NOTIFY_USERS }}
        run: python -m krs_monitor.github_notifications --body-file krs-github-issue-body.md

      - name: Create GitHub issue notification
        if: steps.github_notification.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.github_notification.outputs.title }}" \
            --body-file "${{ steps.github_notification.outputs.body_file }}"
