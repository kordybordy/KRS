name: KRS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 4"
    - cron: "0 8 * * 4"

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Guard scheduled runs for Europe/Warsaw Thursday 09:00
        id: schedule_guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule="${{ github.event.schedule }}"
          local_dow="$(TZ=Europe/Warsaw date +%u)"
          local_hour="$(TZ=Europe/Warsaw date +%H)"
          local_offset="$(TZ=Europe/Warsaw date +%z)"
          should_run=false

          if [ "$local_dow" = "4" ] && [ "$local_hour" = "09" ]; then
            if [ "$schedule" = "0 7 * * 4" ] && [ "$local_offset" = "+0200" ]; then
              should_run=true
            elif [ "$schedule" = "0 8 * * 4" ] && [ "$local_offset" = "+0100" ]; then
              should_run=true
            fi
          fi

          if [ "$should_run" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: local Europe/Warsaw time is $(TZ=Europe/Warsaw date --iso-8601=seconds)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: pytest

      - name: Run KRS monitor
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: python -m krs_monitor.main

      - name: Add report summary to job summary
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        run: |
          latest_summary="$(find reports -mindepth 2 -maxdepth 2 -name summary.txt | sort | tail -n 1)"
          if [ -n "$latest_summary" ]; then
            {
              echo "## KRS monitor result"
              echo
              cat "$latest_summary"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## KRS monitor result" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary report found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports artifact
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: krs-report
          path: reports/

      - name: Commit monitoring outputs
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/archive reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            report_date="$(TZ=Europe/Warsaw date +%F)"
            git commit -m "krs-monitor: weekly report ${report_date}"
            git push
          fi

      - name: Prepare GitHub issue notification
        if: steps.schedule_guard.outputs.should_run == 'true'
        id: github_notification
        env:
          KRS_GITHUB_NOTIFY_USERS: ${{ vars.KRS_GITHUB_NOTIFY_USERS }}
        run: python -m krs_monitor.github_notifications --body-file krs-github-issue-body.md

      - name: Create GitHub issue notification
        if: steps.schedule_guard.outputs.should_run == 'true' && steps.github_notification.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.github_notification.outputs.title }}" \
            --body-file "${{ steps.github_notification.outputs.body_file }}"
